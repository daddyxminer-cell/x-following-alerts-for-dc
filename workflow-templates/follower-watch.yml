name: X follow watch

on:
  schedule:
    # Approximately every 30 minutes; GitHub can delay scheduled jobs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages without sending or changing saved state (still reads X using your cookies)"
        type: boolean
        default: false

concurrency:
  group: x-follow-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    # Keep one authoritative state on the default branch.
    # Public only: standard runners are free; never incur private-runner charges.
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check follow relationships
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_COOKIES: ${{ secrets.X_COOKIES }} # optional JSON alternative
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_ACCOUNTS: ${{ vars.WATCH_ACCOUNTS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # DISCORD_WEBHOOK_NASA: ${{ secrets.DISCORD_WEBHOOK_NASA }}
        run: python follower_watch.py
      - name: Save snapshots and pending deliveries even after a failed check
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git add -- state/followers_state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update follow watch state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "::error::State conflict: resolve manually; not overwriting saved deliveries."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Cannot persist state. Check branch rules and Actions write permission."
          exit 1
